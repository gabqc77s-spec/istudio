<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impulsa V4 | Multiverse OS</title>
    <link rel="stylesheet" href="/src/showcase.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body style="background: #030014; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; margin: 0; padding: 0; overflow-x: hidden;">

    <div id="scene-wrapper" style="width: 100vw; height: 100vh; perspective: 1200px; transform-style: preserve-3d; overflow: hidden;">
        <div id="app" style="width: 100%; height: 100%; position: relative; transform-style: preserve-3d;"></div>
    </div>

    <!-- UI Buttons (Bottom Right) -->
    <div id="ui-controls" style="position: fixed; bottom: 20px; right: 20px; display: flex; gap: 15px; z-index: 100000;">
        <!-- AI Bubble -->
        <div id="ai-bubble" style="background: #06b6d4; color: white; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(6,182,212,0.3); transition: all 0.3s ease;">
            <span class="material-icons-round">smart_toy</span>
        </div>
        <!-- Injector Bubble -->
        <div id="injector-btn" style="background: #a855f7; color: white; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(168,85,247,0.3); transition: all 0.3s ease;">
            <span class="material-icons-round">auto_fix_high</span>
        </div>
    </div>

    <!-- AI Panel -->
    <div id="ai-panel" style="display: none; position: fixed; bottom: 100px; right: 20px; z-index: 100000; background: #0f172a; border: 1px solid #1e293b; border-radius: 20px; width: 380px; height: 500px; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,0.8); overflow: hidden;">
        <div style="background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="material-icons-round" style="color: #38bdf8;">architecture</span>
                <span style="font-weight: 700; font-size: 14px; color: #f8fafc;">ARQUITECTO IA</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="ai-refresh" style="background: none; border: none; color: #94a3b8; cursor: pointer;" title="Refrescar Contexto"><span class="material-icons-round" style="font-size: 20px;">refresh</span></button>
                <button id="close-ai" style="background: none; border: none; color: #94a3b8; cursor: pointer;"><span class="material-icons-round">close</span></button>
            </div>
        </div>
        <div id="ai-messages" style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #020617;">
            <!-- Messages here -->
        </div>
        <div id="ai-attachment-preview" style="display: none; background: #1e293b; padding: 10px 20px; border-top: 1px solid #334155; align-items: center; justify-content: space-between;">
            <span id="ai-attachment-name" style="font-size: 11px; color: #38bdf8; font-family: monospace;"></span>
            <button id="ai-clear-attachment" style="background: none; border: none; color: #ef4444; cursor: pointer;"><span class="material-icons-round" style="font-size: 18px;">cancel</span></button>
        </div>
        <div style="padding: 15px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 10px;">
            <button id="ai-attach" style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; color: #94a3b8; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center;"><span class="material-icons-round">attach_file</span></button>
            <input type="text" id="ai-input" placeholder="Pregunta algo al Arquitecto..." style="flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 12px; color: white; padding: 10px 15px; outline: none; font-size: 14px;">
            <button id="ai-send" style="background: #0ea5e9; color: white; border: none; border-radius: 12px; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center;"><span class="material-icons-round">send</span></button>
        </div>
    </div>

    <!-- Injector Panel -->
    <div id="injector-panel" style="display: none; position: fixed; bottom: 100px; right: 20px; z-index: 100000; background: #18181b; border: 1px solid #27272a; border-radius: 20px; width: 400px; padding: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.8);">
        <h3 style="margin: 0 0 15px 0; font-size: 14px; color: #a855f7; display: flex; align-items: center; gap: 10px;">
            <span class="material-icons-round">code</span> INYECTOR MANUAL
        </h3>
        <textarea id="injector-data" style="width: 100%; height: 250px; background: #09090b; border: 1px solid #27272a; border-radius: 12px; color: #a5b4fc; padding: 15px; font-family: monospace; font-size: 12px; outline: none; resize: none;"></textarea>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <label style="display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 12px; cursor: pointer;">
                <input type="checkbox" id="inject-replace" style="accent-color: #a855f7;"> Reemplazar Estado
            </label>
        </div>
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button id="inject-now" style="flex: 1; background: #9333ea; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 700;">INYECTAR</button>
            <button id="inspect-now" style="background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                <span class="material-icons-round">touch_app</span> CAPTURAR
            </button>
        </div>
        <button id="close-injector" style="margin-top: 10px; width: 100%; background: transparent; color: #52525b; border: none; padding: 5px; cursor: pointer; font-size: 12px; font-weight: bold;">CERRAR</button>
    </div>

    <!-- Review Panel (Modal) -->
    <div id="review-panel" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 200000; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: #09090b; border: 1px solid #27272a; border-radius: 24px; width: 600px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 50px 100px rgba(0,0,0,0.9);">
            <div style="padding: 20px 30px; border-bottom: 1px solid #27272a; background: #18181b; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 800; font-size: 16px; color: #a855f7; letter-spacing: 1px;">REVISIÓN ARQUITECTÓNICA</span>
                <div id="review-status-tag" style="padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 900; text-transform: uppercase;"></div>
            </div>
            <div id="review-content" style="flex: 1; overflow-y: auto; padding: 30px; background: #020617; font-family: 'JetBrains Mono', monospace; font-size: 12px;"></div>
            <div id="review-warnings" style="padding: 15px 30px; background: rgba(239, 68, 68, 0.1); border-top: 1px solid rgba(239, 68, 68, 0.2); display: none; color: #f87171;">
                <div style="font-weight: bold; margin-bottom: 5px;">Avisos:</div>
                <ul id="warnings-list" style="margin: 0; padding-left: 20px; font-size: 11px;"></ul>
            </div>
            <div style="padding: 30px; display: flex; gap: 15px; background: #09090b;">
                <button id="review-cancel" style="flex: 1; background: #27272a; color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 700;">RECHAZAR</button>
                <button id="review-accept" style="flex: 2; background: #9333ea; color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 700;">APLICAR CAMBIOS</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { sendMessage, setInitialContext } from './src/ai_assistant.js';

        // --- Core UI Logic ---
        const aiBubble = document.getElementById('ai-bubble');
        const aiPanel = document.getElementById('ai-panel');
        const aiInput = document.getElementById('ai-input');
        const aiSend = document.getElementById('ai-send');
        const aiMessages = document.getElementById('ai-messages');
        const aiRefresh = document.getElementById('ai-refresh');
        const injectorBtn = document.getElementById('injector-btn');
        const injectorPanel = document.getElementById('injector-panel');

        function togglePanel(btn, panel) {
            const isVisible = panel.style.display === 'flex' || panel.style.display === 'block';
            panel.style.display = isVisible ? 'none' : (panel.id === 'ai-panel' ? 'flex' : 'block');
            if (!isVisible && panel.id === 'ai-panel' && aiMessages.children.length === 0) {
                primeAI();
            }
        }

        async function primeAI() {
            try {
                const content = window.get_v4_current_content();
                const resCss = await fetch('./src/showcase.css');
                const css = await resCss.text();
                const resJs = await fetch('./src/showcase.js');
                const js = await resJs.text();

                setInitialContext(content, css, js);
                addMessage("Hola Gabriel, soy tu Arquitecto IA. He analizado el motor V4 y el estado actual de tu aplicación. ¿Qué vamos a construir?", "ai");
            } catch(e) { console.error("Prime AI error:", e); }
        }

        aiBubble.onclick = () => {
            if (document.getElementById('ui-controls').dataset.preventClick) return;
            togglePanel(aiBubble, aiPanel);
        };
        injectorBtn.onclick = () => {
            if (document.getElementById('ui-controls').dataset.preventClick) return;
            togglePanel(injectorBtn, injectorPanel);
        };
        document.getElementById('close-ai').onclick = () => aiPanel.style.display = 'none';
        document.getElementById('close-injector').onclick = () => injectorPanel.style.display = 'none';
        aiRefresh.onclick = () => primeAI();

        // --- Dragging ---
        function makeDraggable(el, trigger) {
            let startX, startY, initialLeft, initialTop;
            let dragging = false;

            trigger.onpointerdown = (e) => {
                const rect = el.getBoundingClientRect();
                startX = e.clientX; startY = e.clientY;
                initialLeft = rect.left; initialTop = rect.top;
                dragging = false;

                const move = (me) => {
                    const dx = me.clientX - startX;
                    const dy = me.clientY - startY;
                    if (!dragging && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
                        dragging = true;
                        el.style.transition = 'none';
                        trigger.setPointerCapture(e.pointerId);
                    }
                    if (dragging) {
                        el.style.left = (initialLeft + dx) + 'px';
                        el.style.top = (initialTop + dy) + 'px';
                        el.style.bottom = 'auto';
                        el.style.right = 'auto';
                    }
                };
                const up = (ue) => {
                    if (dragging) {
                        try { trigger.releasePointerCapture(ue.pointerId); } catch(e) {}
                        trigger.dataset.preventClick = "true";
                        setTimeout(() => delete trigger.dataset.preventClick, 100);
                    }
                    window.removeEventListener('pointermove', move);
                    window.removeEventListener('pointerup', up);
                };
                window.addEventListener('pointermove', move);
                window.addEventListener('pointerup', up);
            };
        }
        // Draggable container of buttons
        makeDraggable(document.getElementById('ui-controls'), document.getElementById('ui-controls'));

        // --- AI Interactivity ---
        let attachedData = null;
        let isSelecting = false;

        document.getElementById('ai-attach').onclick = () => {
            isSelecting = true;
            document.body.style.cursor = 'crosshair';
            const tip = document.createElement('div');
            tip.id = 'select-tip';
            tip.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #0ea5e9; color: white; padding: 10px 20px; border-radius: 30px; z-index: 1000000; font-weight: 800;';
            tip.textContent = 'Selecciona un elemento [data-path]';
            document.body.appendChild(tip);

            const handler = (e) => {
                const target = e.target.closest('[data-path]');
                if (target && isSelecting) {
                    e.preventDefault(); e.stopPropagation();
                    const path = target.dataset.path;
                    attachedData = window.get_json_v4_por_path_jerarquico(path);
                    document.getElementById('ai-attachment-name').textContent = path;
                    document.getElementById('ai-attachment-preview').style.display = 'flex';
                    stop();
                }
            };
            window.addEventListener('click', handler, { capture: true, once: true });
            function stop() { isSelecting = false; document.body.style.cursor = 'default'; tip.remove(); }
        };

        document.getElementById('ai-clear-attachment').onclick = () => {
            attachedData = null;
            document.getElementById('ai-attachment-preview').style.display = 'none';
        };

        async function handleSend() {
            const val = aiInput.value.trim();
            if (!val && !attachedData) return;
            const currentAttach = attachedData;
            addMessage(val + (currentAttach ? " 📎" : ""), "user");
            aiInput.value = '';
            document.getElementById('ai-attachment-preview').style.display = 'none';
            attachedData = null;

            const loading = addMessage("Procesando...", "ai", true);
            const resp = await sendMessage(val, currentAttach);
            document.getElementById(loading).remove();

            addMessage(resp.text, "ai");
            if (resp.type === 'review') showReview(resp.data);
        }

        aiSend.onclick = handleSend;
        aiInput.onkeypress = (e) => { if(e.key==='Enter') handleSend(); };

        function addMessage(text, role, loading = false) {
            const msg = document.createElement('div');
            const id = 'm-' + Math.random();
            msg.id = id;
            msg.style.cssText = `
                padding: 12px 16px; border-radius: 20px; font-size: 13px; line-height: 1.5; max-width: 85%;
                background: ${role==='ai' ? '#1e293b' : '#3b82f6'};
                color: white; align-self: ${role==='ai' ? 'flex-start' : 'flex-end'};
                ${loading ? 'opacity: 0.5' : ''}
            `;
            msg.textContent = text;
            aiMessages.appendChild(msg);
            aiMessages.scrollTop = aiMessages.scrollHeight;
            return id;
        }

        // --- Review & Injection ---
        let pending = null;
        function showReview(data) {
            pending = data;
            const reviewPanel = document.getElementById('review-panel');
            const reviewContent = document.getElementById('review-content');
            reviewContent.innerHTML = `<pre style="color: #6366f1;">${JSON.stringify(data, null, 2)}</pre>`;
            reviewPanel.style.display = 'flex';
        }
        document.getElementById('review-accept').onclick = () => {
            window.inyectar_cambios_v4(pending);
            addMessage("✅ Cambios aplicados.", "ai");
            document.getElementById('review-panel').style.display = 'none';
        };
        document.getElementById('review-cancel').onclick = () => {
            document.getElementById('review-panel').style.display = 'none';
        };

        // --- Manual Injector ---
        document.getElementById('inject-now').onclick = () => {
            try {
                const data = JSON.parse(document.getElementById('injector-data').value);
                const replace = document.getElementById('inject-replace').checked;
                window.inyectar_cambios_v4({ partial: data, replace });
            } catch(e) { alert("JSON Error: " + e.message); }
        };
        document.getElementById('inspect-now').onclick = () => {
            isSelecting = true;
            document.body.style.cursor = 'crosshair';
            const handler = (e) => {
                const target = e.target.closest('[data-path]');
                if (target && isSelecting) {
                    const path = target.dataset.path;
                    const json = window.get_json_v4_por_path_jerarquico(path);
                    document.getElementById('injector-data').value = JSON.stringify(json, null, 2);
                    isSelecting = false; document.body.style.cursor = 'default';
                }
            };
            window.addEventListener('click', handler, { capture: true, once: true });
        };

    </script>
    <script type="module" src="/src/showcase.js"></script>
</body>
</html>
