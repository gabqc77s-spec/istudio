<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impulsa V4</title>
    <link rel="stylesheet" href="./src/showcase.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: #030014; color: #ffffff; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; perspective: 1000px; transform-style: preserve-3d; position: relative;">
    <div id="app" style="width: 100%; min-height: 100vh; position: relative; transform-style: preserve-3d; overflow-x: hidden;"></div>

    <!-- UI Inyector -->
    <div id="injector-btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: #a855f7; color: white; width: 60px; height: 60px; border-radius: 50%; cursor: move; font-size: 24px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.3s ease; user-select: none; touch-action: none;">
        💉
    </div>

    <div id="injector-panel" style="display: none; position: fixed; bottom: 90px; right: 20px; z-index: 1000; background: #18181b; border: 1px solid #27272a; border-radius: 12px; width: 350px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <h3 style="margin-top: 0; font-size: 14px; color: #a855f7;">Inyectar JSON Parcial</h3>
        <textarea id="injector-data" style="width: 100%; height: 200px; background: #09090b; border: 1px solid #27272a; border-radius: 6px; color: #e4e4e7; padding: 10px; font-family: monospace; font-size: 11px; resize: vertical;" placeholder='{ "pagina_principal": { ... } }'></textarea>
        <div style="margin-top: 10px; display: flex; gap: 10px;">
            <button id="inject-now" style="flex: 1; background: #9333ea; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: 600;">Inyectar Cambios</button>
            <button id="close-injector" style="background: #27272a; color: #e4e4e7; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer;">Cerrar</button>
        </div>
    </div>

    <script type="module">
        const btn = document.getElementById('injector-btn');
        const panel = document.getElementById('injector-panel');
        const close = document.getElementById('close-injector');
        const inject = document.getElementById('inject-now');
        const data = document.getElementById('injector-data');

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        btn.addEventListener('mousedown', startDrag);
        btn.addEventListener('touchstart', startDrag, { passive: false });

        function startDrag(e) {
            isDragging = false;
            const event = e.type === 'touchstart' ? e.touches[0] : e;
            startX = event.clientX;
            startY = event.clientY;

            const rect = btn.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            isDragging = true;
            const event = e.type === 'touchmove' ? e.touches[0] : e;
            const dx = event.clientX - startX;
            const dy = event.clientY - startY;

            const newLeft = initialLeft + dx;
            const newTop = initialTop + dy;

            btn.style.left = newLeft + 'px';
            btn.style.top = newTop + 'px';
            btn.style.bottom = 'auto';
            btn.style.right = 'auto';

            // Actualizar panel
            updatePanelPosition(newLeft, newTop);

            if (e.cancelable) e.preventDefault();
        }

        function stopDrag() {
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        function updatePanelPosition(btnLeft, btnTop) {
            const panelWidth = 350;
            const panelHeight = 300; // Aprox

            let panelLeft = btnLeft - panelWidth + 60;
            let panelTop = btnTop - panelHeight - 10;

            // Clamp boundaries
            if (panelLeft < 10) panelLeft = 10;
            if (panelTop < 10) panelTop = btnTop + 70; // Mostrar abajo si no cabe arriba

            panel.style.left = panelLeft + 'px';
            panel.style.top = panelTop + 'px';
            panel.style.bottom = 'auto';
            panel.style.right = 'auto';
        }

        btn.onclick = (e) => {
            if (isDragging) return;
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
            if (panel.style.display === 'block') {
                const rect = btn.getBoundingClientRect();
                updatePanelPosition(rect.left, rect.top);
            }
        };

        close.onclick = () => {
            panel.style.display = 'none';
        };

        inject.onclick = () => {
            try {
                const input = JSON.parse(data.value);
                // Usamos el punto de entrada global inteligente
                if (window.inyectar_cambios_v4) {
                    window.inyectar_cambios_v4(input);
                } else {
                    // Fallback
                    const partial = input.args ? input.args.partial : (input.partial || input);
                    window.postMessage({ type: 'inject-partial', partial }, '*');
                }
                // Optional: visual feedback
                inject.textContent = '¡Inyectado!';
                inject.style.background = '#10b981';
                setTimeout(() => {
                    inject.textContent = 'Inyectar Cambios';
                    inject.style.background = '#9333ea';
                }, 2000);
            } catch (e) {
                alert('Error en el JSON: ' + e.message);
            }
        };
    </script>

    <script type="module" src="./src/showcase.js"></script>
</body>
</html>
